name: Profile stats

on:
  schedule:
    - cron: "0 23 * * *" # once a day, 23:00 UTC = 00:00 Polish winter time (01:00 in summer)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-daily
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate stat cards
        run: node scripts/generate-stats.mjs
        env:
          # Fine-grained PAT of DamTchorzewski (read-only) -> includes private repos and contributions.
          # Without it the Actions token is used and the cards show public data only.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/stats
          if git diff --staged --quiet; then
            echo "Stats unchanged"
          else
            git commit -m "Update profile stats"
            git pull --rebase
            git push
          fi
