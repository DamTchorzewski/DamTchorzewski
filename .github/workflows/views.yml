name: Profile views badge

on:
  schedule:
    - cron: "0 23 * * *" # once a day, 23:00 UTC = 00:00 Polish winter time (01:00 in summer)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-daily
  cancel-in-progress: false

jobs:
  views:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read the counter and draw the badge
        run: node scripts/generate-views.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/badges/views-dark.svg img/badges/views-light.svg
          if git diff --staged --quiet; then
            echo "Views unchanged"
          else
            git commit -m "Update profile views"
            git pull --rebase
            git push
          fi
